<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kraken Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stage.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
    #display { position: fixed; inset: 0; }
    .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0;
           color: #fff; font: 600 20px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center; }
    .msg[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="display"></div>
  <script src="config.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/player.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
